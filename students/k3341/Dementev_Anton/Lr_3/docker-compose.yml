services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: team_finder_db
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d team_finder_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    image: lr3-web:latest
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/team_finder_db
      SECRET_KEY: docker-dev-secret-change-me
      PARSER_URL: http://parser:8001
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  parser:
    build: ./parser
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/team_finder_db
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine

  worker:
    image: lr3-web:latest
    command: celery -A app.core.celery_app:celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/team_finder_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  beat:
    image: lr3-web:latest
    command: celery -A app.core.celery_app:celery_app beat --loglevel=info
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started

volumes:
  pgdata:
